name: AquaShield Repo-Wide CI/CD Pipeline

on:
  push:
    branches:
      - 'main'
      - 'master'
      - 'dev-a/**'
      - 'dev-b/**'
      - 'dev-c/**'
      - 'dev-d/**'
      - 'dev/**'
      - 'infra/**'
  pull_request:
    branches:
      - 'main'
      - 'master'
      - 'dev-a/**'
      - 'dev-b/**'
      - 'dev-c/**'
      - 'dev-d/**'
      - 'dev/**'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  secret-scan:
    name: 🔒 Secret & Credential Leak Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Secret Leak Scanner
        run: python scripts/ci/secret_scan.py

  backend-ci:
    name: 🐍 Backend Lint, Type Check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Base Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest ruff mypy safety

      - name: Linting & Formatting Check (Ruff)
        run: |
          if [ -d backend ]; then
            ruff check backend/
          elif [ -d app ]; then
            ruff check app/
          else
            echo "No backend python modules found to lint yet."
          fi

      - name: Static Type Check (MyPy)
        run: |
          if [ -d backend/app ]; then
            mypy backend/app/ --ignore-missing-imports
          else
            echo "Skipping mypy check — backend/app directory not yet populated on this branch."
          fi

      - name: Dependency Vulnerability Audit
        run: |
          safety check || echo "::warning::Dependency vulnerability audit flagged advisory packages."

      - name: Run Pytest Suite
        run: |
          if [ -d backend/tests ]; then
            pytest backend/tests/ -v
          elif [ -d tests ]; then
            pytest tests/ -v
          else
            echo "No unit test directory found on this branch yet."
          fi

  frontend-ci:
    name: ⚛️ Frontend Lint, Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install & Verify Frontend Dependencies
        run: |
          if [ -d frontend ] && [ -f frontend/package.json ]; then
            cd frontend
            npm ci || npm install
            if npm run | grep -q "lint"; then
              npm run lint
            fi
            if npm run | grep -q "type-check"; then
              npm run type-check
            elif [ -f tsconfig.json ]; then
              npx tsc --noEmit
            fi
            if npm run | grep -q "build"; then
              npm run build
            fi
          else
            echo "Frontend directory not yet populated on this branch."
          fi

  contract-validation:
    name: 📜 API Schema & Data Contract Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Contracts against BLUEPRINT.md §3
        run: python scripts/ci/contract_validator.py

  resilience-checks:
    name: 🛡️ Edge-Case & System Resilience Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Edge-Case Resilience Suite
        run: python scripts/ci/resilience_runner.py

  ci-summary:
    name: 📊 CI/CD Per-Branch Status Reporter
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - backend-ci
      - frontend-ci
      - contract-validation
      - resilience-checks
    if: always()
    steps:
      - name: Generate Actionable Step Summary
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          COMMIT_SHA="${{ github.sha }}"

          echo "## 🚀 AquaShield CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Target Branch:** \`$BRANCH_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit SHA:** \`$COMMIT_SHA\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Check Category | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Secret & Credential Leak Scan | ${{ needs.secret-scan.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐍 Backend Quality & Tests | ${{ needs.backend-ci.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚛️ Frontend Build & Types | ${{ needs.frontend-ci.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📜 API Contract Validation | ${{ needs.contract-validation.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ Resilience & Edge-Case Checks | ${{ needs.resilience-checks.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.secret-scan.result }}" != "success" ] || \
             [ "${{ needs.backend-ci.result }}" != "success" ] || \
             [ "${{ needs.frontend-ci.result }}" != "success" ] || \
             [ "${{ needs.contract-validation.result }}" != "success" ] || \
             [ "${{ needs.resilience-checks.result }}" != "success" ]; then
            echo "### ⚠️ Action Required" >> $GITHUB_STEP_SUMMARY
            echo "One or more checks failed on branch \`$BRANCH_NAME\`. Merging to \`main\` is blocked until all checks pass green." >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🎉 All Pipeline Checks Passed!" >> $GITHUB_STEP_SUMMARY
            echo "Branch \`$BRANCH_NAME\` satisfies all code quality, contract, security, and resilience standards." >> $GITHUB_STEP_SUMMARY
          fi
